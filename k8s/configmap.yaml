apiVersion: v1
kind: ConfigMap
metadata:
  name: messenger-config
  namespace: messenger
data:
  # Application
  NODE_ENV: "production"
  APP_NAME: "Messenger"
  
  # Database
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "messenger_db"
  
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # MinIO
  MINIO_ENDPOINT: "minio-service"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "messenger-files"
  
  # MeiliSearch
  MEILISEARCH_HOST: "http://meilisearch-service:7700"
  
  # Backend
  BACKEND_PORT: "3001"
  
  # Frontend
  NEXT_PUBLIC_API_URL: "https://messenger.example.com/api"
  NEXT_PUBLIC_WS_URL: "wss://messenger.example.com"
  NEXT_PUBLIC_APP_NAME: "Messenger"
  FRONTEND_URL: "https://messenger.example.com"
